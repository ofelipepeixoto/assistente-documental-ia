name: Verificar busca documental

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Obter arquivos do projeto
        uses: actions/checkout@v6

      - name: Executar verificações sem chave de API
        run: env -u OPENAI_API_KEY python3 -m unittest -v test_busca.py test_resposta_ia.py test_avaliacao_demo.py

      - name: Medir baseline da busca
        run: python3 avaliar.py
