name: Piloto local de memória revisável
on: [push, pull_request]
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --require-hashes -r requirements-pdf.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -r requirements-memory.txt
      - run: python -m playwright install --with-deps chromium
      - name: Testar consumidor real e regressões sem chave
        run: |
          env -u OPENAI_API_KEY PDF_BROWSER_TESTS=1 python -m unittest discover -v
          env -u OPENAI_API_KEY PDF_BROWSER_TESTS=1 python -m unittest discover -s memory_tests -v
          ruff check ingestion/project_memory.py memoria_web.py memory_tests
          python -m compileall -q ingestion/project_memory.py memoria_web.py
